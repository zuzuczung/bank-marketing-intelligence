[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-intelligence"
version = "0.1.0"
description = "Reproducible UCI Bank Marketing analysis with PostgreSQL and Superset"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5", "psycopg[binary]==3.2.10", "python-dotenv==1.1.1"]

[project.scripts]
bank-bi = "bank_bi.cli:main"

[tool.setuptools.packages.find]
include = ["bank_bi*"]
